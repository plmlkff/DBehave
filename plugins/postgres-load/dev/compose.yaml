# Локальный стенд нагрузчика без воркера: БД + нагрузчик + Prometheus + Grafana с дашбордом.
#   docker compose -f plugins/postgres-load/dev/compose.yaml up -d --build
#   docker compose -f plugins/postgres-load/dev/compose.yaml logs -f load
# Повторить запуск после правок:
#   docker compose -f plugins/postgres-load/dev/compose.yaml up -d --force-recreate database load
# Grafana: http://localhost:3001 (дашборд «DBehave · PostgreSQL», запуск run_id=local)
# Сценарий и параметры меняются в environment сервиса load, настройки PostgreSQL — в command сервиса database.
services:
  database:
    image: postgres:18
    command: ["docker-entrypoint.sh", "postgres", "-c", "synchronous_commit=on", "-c", "max_connections=100"]
    environment:
      POSTGRES_DB: dbehave
      POSTGRES_USER: dbehave
      POSTGRES_PASSWORD: dbehave

  load:
    build:
      context: ../../..
      dockerfile: plugins/postgres-load/Dockerfile
    image: dbehave/postgres-load:0.1.0
    environment:
      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: dbehave
      DB_USER: dbehave
      DB_PASSWORD: dbehave
      SCENARIO: write-heavy
      CLIENTS: "16"
      WARMUP_SEC: "5"
      DURATION_SEC: "40"
      BATCH_SIZE: "1"
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      - database

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_LOG_LEVEL: warn
    volumes:
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ../grafana:/var/lib/grafana/dashboards/dbehave:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
