plugins {
    id 'application'
}

dependencies {
    implementation 'org.postgresql:postgresql:42.7.14'
    implementation project(':plugins:load-common')

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'io.prometheus:prometheus-metrics-exposition-textformats:1.10.0'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'io.dbehave.plugin.postgres.load.Main'
    applicationName = 'postgres-load'
    applicationDefaultJvmArgs = ['-XX:MaxRAMPercentage=75']
}

tasks.named('test') {
    useJUnitPlatform()
}
