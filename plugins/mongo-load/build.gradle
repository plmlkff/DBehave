plugins {
    id 'application'
}

dependencies {
    implementation project(':plugins:mongo')
    implementation project(':plugins:load-common')
    implementation 'org.mongodb:mongodb-driver-sync:5.6.5'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testImplementation 'io.prometheus:prometheus-metrics-exposition-textformats:1.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'io.dbehave.plugin.mongo.load.Main'
    applicationName = 'mongo-load'
    applicationDefaultJvmArgs = ['-XX:MaxRAMPercentage=75']
}

tasks.named('test') {
    useJUnitPlatform()
    inputs.property('mongoIntegrationUri', providers.environmentVariable('DBEHAVE_TEST_MONGO_URI').orElse(''))
    inputs.property('mongoUncompressedUri', providers.environmentVariable('DBEHAVE_TEST_MONGO_UNCOMPRESSED_URI').orElse(''))
}
