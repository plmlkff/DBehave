name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: dbehave_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dbehave_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and test
        env:
          DBEHAVE_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/dbehave_test
          DBEHAVE_TEST_DATABASE_USERNAME: postgres
          DBEHAVE_TEST_DATABASE_PASSWORD: postgres
        run: ./gradlew --no-daemon build
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test form compatibility
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Lint frontend
        run: npm run lint
