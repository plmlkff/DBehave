name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: dbehave_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dbehave_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:25.8.4.13
        env:
          CLICKHOUSE_DB: dbehave
          CLICKHOUSE_USER: dbehave
          CLICKHOUSE_PASSWORD: dbehave
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --user dbehave --password dbehave --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Start MongoDB without compression for comparison
        run: |
          docker run --detach --name mongo-uncompressed --publish 127.0.0.1:27018:27017 mongo:8.0 \
            mongod --bind_ip_all --wiredTigerJournalCompressor=none --wiredTigerIndexPrefixCompression=false
          for attempt in {1..30}; do
            if docker exec mongo-uncompressed mongosh --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Build and test
        env:
          DBEHAVE_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/dbehave_test
          DBEHAVE_TEST_DATABASE_USERNAME: postgres
          DBEHAVE_TEST_DATABASE_PASSWORD: postgres
          DBEHAVE_TEST_MONGO_URI: mongodb://localhost:27017
          DBEHAVE_TEST_MONGO_UNCOMPRESSED_URI: mongodb://localhost:27018
          DBEHAVE_TEST_CLICKHOUSE_URL: http://127.0.0.1:8123
        run: ./gradlew --no-daemon build
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test form compatibility
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Lint frontend
        run: npm run lint
