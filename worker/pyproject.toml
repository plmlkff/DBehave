[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "db-load-worker"
version = "0.1.0"
description = "Isolated Docker worker for database load-test jobs"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30,<1",
  "docker>=7.1,<8",
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "psutil>=6,<8",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.setuptools.packages.find]
include = ["worker*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
