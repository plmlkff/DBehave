plugins {
    id 'java'
    id 'org.springframework.boot'
}

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    implementation project(':plugin-api')
    implementation project(':plugins:postgres')
    implementation project(':plugins:mongo')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    inputs.property('integrationDatabaseUrl', providers.environmentVariable('DBEHAVE_TEST_DATABASE_URL').orElse(''))
    inputs.property('integrationDatabaseUsername', providers.environmentVariable('DBEHAVE_TEST_DATABASE_USERNAME').orElse('postgres'))
}

tasks.named('bootJar') {
    archiveFileName = 'dbehave.jar'
}
